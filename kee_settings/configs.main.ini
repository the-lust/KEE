[main]
; Emulator behavior — controls all core emulator features
save_path = ./saves
enable_logging = true
log_level = info
disable_online_networking = false
enable_overlay = true
enable_overlay_notification_sounds = false

[network]
; P2P port range for LAN multiplayer
p2p_port_min = 7777
p2p_port_max = 7877
broadcast_port = 55789
advertise_rate_ms = 2000
broadcast_address = 255.255.255.255
; relay_control: 0=AllowRelays, 1=ForceRelays, 2=NoRelays
relay_control = 2
force_lan = true

[entitlements]
unlock_dlcs = true
unlock_entitlements = true

[achievements]
allow_unknown_achievements = true

[stats]
allow_unknown_stats = true
