[app]
; Per-game application identifiers
; These override the auto-detected values from the game's executable name.
; If left empty, the emulator will attempt to infer them from known games
; or use defaults.
app_name =
app_id =
deployment_id =
sandbox_id =

; Files for achievement/stat/leaderboard data
; Paths are relative to egs_settings/
achievements_file = achievements.json
stats_file = stats.json
leaderboards_file = leaderboards.txt
