; KEE Cold Loader Configuration
[Loader]
; Target executable path (relative or absolute)
Target = game.exe

; Working directory (leave empty to use target's parent dir)
WorkingDirectory = 

; Command line arguments passed to the target
Arguments = 

; Inject the EOS SDK emulation DLL
InjectEOS = 1

; Inject the EGS Client emulation DLL
InjectEGClient = 0

; DLL names (auto = use platform default)
EOSSDKDLL = auto
EGClientDLL = auto

; Copy proxy DLLs (version.dll, winmm.dll) to target directory
UseDLLProxy = 0
