; KEE Emulator Configuration
; Copy this folder as "egs_settings" next to your game EXE.
; Edit the values below to match your account and preferences.

[Account]
; Your display name in-game
DisplayName = Player

; Your Epic account ID (hex string, 32 chars)
EpicAccountID = 00000000000000000000000000000000

; Product user ID for the EOS Connect subsystem
ProductUserID = 00000000000000000000000000000000

[Online]
; Exchange code used for authentication
ExchangeCode = your-exchange-code-here

; Access token (auto-filled after first auth)
AccessToken = eg1~your-access-token

; Refresh token for token renewal
RefreshToken = eg1~your-refresh-token

; ID token for identity verification
IdToken = eg1~your-id-token

; Auth password (same as exchange code typically)
AuthPassword = your-exchange-code-here

[System]
; Language code (en, fr, de, ja, ko, zh-CN, etc)
Language = en

; Save data directory (relative to game exe)
SavePath = saves

; Enable logging (0=off, 1=on)
Logging = 1

; Automatically unlock all DLC/entitlements
UnlockDLCs = 1

; Disable online networking (LAN-only mode)
DisableOnlineNetworking = 0

[Network]
; Broadcast address for LAN discovery
BroadcastAddress = 255.255.255.255
